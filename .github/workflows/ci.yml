name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (locked)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

      - name: Production build (hardened)
        env:
          VITE_BACKEND_URL: https://chat.invalid
        run: npm run build:hardened

      - name: Verify no source maps or plaintext secrets in bundle
        run: |
          set -euo pipefail
          if find dist -name '*.map' | grep -q .; then echo "source maps present in dist/"; exit 1; fi
          if grep -rEl "localhost:5000|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}" dist/; then echo "forbidden string in bundle"; exit 1; fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          retention-days: 7
